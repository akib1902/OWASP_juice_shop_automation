# =============================================================================
#  CI pipeline
# =============================================================================
#  Shape of the pipeline, and why:
#
#   1. `juice-shop` is a service container, so the SUT version is pinned by the
#      workflow — not by whatever is running on someone's laptop.
#   2. `check` runs lint + format first: a style failure should cost 20s, not a
#      full browser matrix.
#   3. `api` runs before the UI on purpose: it is the fastest signal that the
#      deployment is up and the contract is intact. If it fails, the UI matrix
#      is cancelled instead of burning 6 minutes to report the same problem.
#   4. `e2e` is sharded 2× on Chromium — the release gate. Firefox/WebKit run
#      nightly (see `schedule`) so cross-browser coverage never slows a PR.
#   5. Artifacts (HTML report, JUnit, JSON, traces) upload even on failure:
#      "failed" must always come with evidence.
# =============================================================================
name: playwright

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * *' # nightly cross-browser run
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: http://localhost:3000
  CI: true

jobs:
  check:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  api:
    name: API contract (gate)
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports: ['3000:3000']
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/rest/admin/application-version || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:env
      # API project needs no browser binary at all.
      - run: npm run test:api
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: reports/
          retention-days: 7

  e2e:
    name: UI / chromium (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: api
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports: ['3000:3000']
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/rest/admin/application-version || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-report-${{ matrix.shard }}
          path: reports/
          retention-days: 7

  cross-browser:
    name: nightly / ${{ matrix.project }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: api
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit, mobile-chrome]
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports: ['3000:3000']
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/rest/admin/application-version || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-report
          path: reports/
          retention-days: 14
